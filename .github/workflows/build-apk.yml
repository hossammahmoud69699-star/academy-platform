
name: Build Monsatak Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/student/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/student

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          flutter create --platforms=android --org com.monsatak .
          
      - name: Get dependencies
        run: flutter pub get

      - name: Build Android APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="${{ vars.SUPABASE_URL }}" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="${{ vars.SUPABASE_PUBLISHABLE_KEY }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: monsatak-student-apk
          path: apps/student/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
